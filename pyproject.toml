[tool.pytest.ini_options]
# Only collect real unit tests (the scripts/ folder calls live APIs)
testpaths = ["tests"]
# Lets tests do "from backend.x import y" like app.py does
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["venv"]

[tool.ruff.lint]
# Real errors only: syntax, undefined names, unused imports, redefinitions
select = ["E4", "E7", "E9", "F"]
